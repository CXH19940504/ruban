[rule_1]
# 规则名称
name = 库存新增告警
# 触发条件：quantity从0增加（核心判断字段）
target_field = last_quantity
condition_type = increase
old_value = 0
compare_value=100
# 告警描述
description = 商品库存从0变为非0，可能是新品入库

[rule_2]
# 规则名称
name = 订单状态异常告警
# 触发条件：status从0变为3或4
target_field = status
condition_type = change_from_to
# 变化前的值
old_value = 0
# 变化后允许的值（逗号分隔的列表）
new_value = 3,4
# 告警描述
description = 订单状态从初始值(0)变为异常状态(3/4)，需人工核查